<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Source One Home Loans</title>
  <desc id="description">Approved Source One Home Loans seal with a horizontal company wordmark.</desc>
  <defs>
    <clipPath id="seal-clip">
      <circle cx="180" cy="180" r="170" />
    </clipPath>
  </defs>

  <image
    href="source-one-approved-logo-400.png"
    xlink:href="source-one-approved-logo-400.png"
    x="10"
    y="10"
    width="340"
    height="340"
    preserveAspectRatio="xMidYMid meet"
    clip-path="url(#seal-clip)"
  />

  <line x1="390" y1="58" x2="390" y2="302" stroke="#D4A017" stroke-width="4" />

  <text x="445" y="154" font-family="Georgia, 'Times New Roman', serif" font-size="80" letter-spacing="2">
    <tspan fill="#FFFFFF">SOURCE </tspan><tspan fill="#D4A017">ONE</tspan>
  </text>

  <line x1="448" y1="190" x2="615" y2="190" stroke="#D4A017" stroke-width="4" />
  <line x1="998" y1="190" x2="1165" y2="190" stroke="#D4A017" stroke-width="4" />
  <text x="808" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" letter-spacing="15" fill="#FFFFFF">HOME LOANS</text>

  <text x="805" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" letter-spacing="5" fill="#D4A017">YOUR HOME  |  YOUR FUTURE  |  OUR FOCUS</text>
</svg>
